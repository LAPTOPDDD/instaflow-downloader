<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InstaFlow</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <img src="../assets/logo.svg" width="40" height="40" alt="">
          <div>
            <div class="brand-name">InstaFlow</div>
            <div class="brand-caption">медиа в один клик</div>
          </div>
        </div>
        <button class="icon-button" id="settingsButton" type="button" aria-label="Открыть настройки" title="Настройки">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.96 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.6 8.96a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.96 4.6 1.7 1.7 0 0 0 10 3.08V3h4v.08a1.7 1.7 0 0 0 1.03 1.53 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <section class="context-card" id="contextCard" aria-live="polite">
        <div class="context-icon" id="contextIcon">
          <span class="scan-ring"></span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/>
            <path d="m4.5 16 4.2-4.2a2 2 0 0 1 2.8 0l1.2 1.2 1.6-1.6a2 2 0 0 1 2.8 0l3.4 3.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="16.5" cy="9" r="1.5" fill="currentColor"/>
          </svg>
        </div>
        <div class="context-copy">
          <div class="eyebrow" id="contextEyebrow">ПОИСК ПУБЛИКАЦИИ</div>
          <div class="context-title" id="contextTitle">Проверяю страницу…</div>
          <div class="context-detail" id="contextDetail">Фото, видео или карусель</div>
        </div>
        <span class="status-dot" id="statusDot" aria-hidden="true"></span>
      </section>

      <button class="primary-button" id="downloadButton" type="button" disabled>
        <span class="button-shine"></span>
        <svg class="download-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 15v3.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="downloadLabel">Скачать публикацию</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <section class="save-card">
        <div class="save-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3.5 7.5h6l2 2h9v8.75A2.75 2.75 0 0 1 17.75 21H6.25a2.75 2.75 0 0 1-2.75-2.75V7.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M3.5 7.5V6.75A2.75 2.75 0 0 1 6.25 4h3l2 2h6.5a2.75 2.75 0 0 1 2.75 2.75v.75" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="save-copy">
          <span>Сохранение</span>
          <strong id="folderPath">Загрузки/Instagram/аккаунт</strong>
        </div>
      </section>

      <label class="toggle-row">
        <span>
          <strong>Кнопки на публикациях</strong>
          <small>Самый быстрый способ скачать</small>
        </span>
        <input id="inlineToggle" type="checkbox" checked>
        <span class="toggle" aria-hidden="true"><span></span></span>
      </label>

      <footer class="footer">
        <div class="shortcut"><kbd>Alt</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>D</kbd></div>
        <span class="privacy">без сторонних серверов</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
